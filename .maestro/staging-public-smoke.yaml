appId: com.emergentmindlab.offerhoundv2.staging
name: OfferHound QA public launch and sign-in screen
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Essential Only
    timeout: 60000
- tapOn: Essential Only
- assertVisible: Account
- tapOn: Account
- assertVisible: Welcome Back
- assertVisible: Email
- assertVisible: Password
- assertVisible: Sign In
- assertVisible: Continue with Google
- assertVisible: Continue with Apple
- takeScreenshot: staging-sign-in
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Account
    timeout: 30000
