appId: com.emergentmindlab.offerhoundv2.staging
name: Staff directory and messaging read-only acceptance
---
- runFlow:
    file: common/login.yaml
    env:
      QA_EMAIL: qa.college-coach@offerhound.test
      QA_PASSWORD: ${MAESTRO_QA_COLLEGE_COACH_PASSWORD}
- extendedWaitUntil:
    visible: (?s).*Pipeline.*
    timeout: 60000
- scrollUntilVisible:
    element:
      id: coach-edit-profile
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: coach-edit-profile
- scrollUntilVisible:
    element:
      text: Cancel
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: Cancel
- scrollUntilVisible:
    element:
      id: coach-edit-profile
    direction: UP
    centerElement: true
    timeout: 30000
- scrollUntilVisible:
    element:
      id: staff-add-record
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: staff-add-record
- extendedWaitUntil:
    visible: Add Staff Member
    timeout: 30000
- assertVisible: Full Name.*
- takeScreenshot: staff-editor-readonly
- tapOn:
    id: staff-editor-cancel
- scrollUntilVisible:
    element:
      text: Staff Messages
    direction: DOWN
    centerElement: true
    timeout: 30000
- scrollUntilVisible:
    element:
      text: No eligible staff contacts
    direction: DOWN
    timeout: 60000
- takeScreenshot: staff-messages-confirmed-empty
- runFlow:
    file: common/logout.yaml
