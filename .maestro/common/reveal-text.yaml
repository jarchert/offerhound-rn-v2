appId: com.emergentmindlab.offerhoundv2.staging
---
- repeat:
    times: 16
    commands:
      - runFlow:
          when:
            notVisible: ${QA_SCROLL_TEXT}
          commands:
            - swipe:
                start: 50%, 68%
                end: 50%, 28%
                duration: 400
            - waitForAnimationToEnd:
                timeout: 3000
- assertVisible: ${QA_SCROLL_TEXT}
