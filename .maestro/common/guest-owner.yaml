appId: com.emergentmindlab.offerhoundv2.staging
---
- runFlow:
    file: login.yaml
    env:
      QA_EMAIL: qa.college-coach@offerhound.test
      QA_PASSWORD: ${MAESTRO_QA_COLLEGE_COACH_PASSWORD}
- extendedWaitUntil:
    visible: ".*Pipeline.*"
    timeout: 60000
- runFlow:
    file: open-qa-link.yaml
    env:
      QA_LINK: offerhound-staging://camps/${MAESTRO_QA_GUEST_CAMP_ID}/mobile-checkin
- tapOn: ".*Walk-up.*"
- extendedWaitUntil:
    visible: Guest walk-up registration
    timeout: 60000
- tapOn:
    id: guest-walkup-name
- inputText: ${QA_GUEST_LABEL} OWNER ONE
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: guest-walkup-submit
    direction: DOWN
    timeout: 20000
- tapOn:
    id: guest-walkup-submit
- scrollUntilVisible:
    element:
      text: ${QA_GUEST_LABEL} OWNER ONE registered
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible: ${QA_GUEST_LABEL} OWNER ONE registered
    timeout: 60000
- scrollUntilVisible:
    element:
      id: guest-walkup-name
    direction: UP
    timeout: 20000
- tapOn:
    id: guest-walkup-name
- inputText: ${QA_GUEST_LABEL} OWNER TWO
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: guest-walkup-submit
    direction: DOWN
    timeout: 20000
- tapOn:
    id: guest-walkup-submit
- scrollUntilVisible:
    element:
      text: ${QA_GUEST_LABEL} OWNER TWO registered
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible: ${QA_GUEST_LABEL} OWNER TWO registered
    timeout: 60000
- assertVisible: ${QA_GUEST_LABEL} OWNER ONE registered
- takeScreenshot: guest-owner-two-registrations
- runFlow:
    file: logout.yaml
    env:
      QA_EMAIL: qa.college-coach@offerhound.test
