appId: com.emergentmindlab.offerhoundv2.staging
---
- runFlow: signed-out-entry.yaml
- tapOn: ".*Account.*"
- assertVisible: Welcome Back
- tapOn: Email
- inputText:
    text: ${QA_EMAIL}
    label: Enter synthetic QA email
- tapOn: Password
- inputText:
    text: ${QA_PASSWORD}
    label: Enter private QA test password
- hideKeyboard
- tapOn: '(?-i)^Sign In$'
- tapOn:
    text: Not Now
    optional: true
