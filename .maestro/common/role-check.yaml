appId: com.emergentmindlab.offerhoundv2.staging
---
- extendedWaitUntil:
    visible: ${QA_ROLE_MARKER}
    timeout: 60000
- takeScreenshot: staging-role-${QA_ROLE_KEY}
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ${QA_ROLE_MARKER}
    timeout: 60000
- runFlow:
    file: open-qa-link.yaml
    env:
      QA_LINK: offerhound-staging://admin
- extendedWaitUntil:
    visible: Admins only
    timeout: 30000
- assertNotVisible: Platform overview
- runFlow:
    file: logout.yaml
    env:
      QA_EMAIL: ${QA_EMAIL}
