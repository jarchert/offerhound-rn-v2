appId: com.emergentmindlab.offerhoundv2.staging
name: QA club-coach login restore admin denial and logout
---
- runFlow:
    file: common/login.yaml
    env:
      QA_EMAIL: qa.club-coach@offerhound.test
      QA_PASSWORD: ${MAESTRO_QA_CLUB_COACH_PASSWORD}
- runFlow:
    when:
      visible: Terms of Use & Privacy Policy
    file: common/accept-qa-terms.yaml
- runFlow:
    file: common/role-check.yaml
    env:
      QA_EMAIL: qa.club-coach@offerhound.test
      QA_ROLE_KEY: club-coach
      QA_ROLE_MARKER: "Club Dashboard"
