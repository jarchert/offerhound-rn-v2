name: OfferHound recruiter repair role regression
on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
      platform:
        type: choice
        required: true
        default: ios
        options: [ios, android]
jobs:
  candidate:
    type: repack
    runs_on: "${{ inputs.platform == 'android' ? 'linux-medium' : 'macos-medium' }}"
    environment: preview
    params:
      build_id: ${{ inputs.build_id }}
      profile: staging
      message: Verify recruiter repairs and role isolation without fixture mutations
  athletes_guardians:
    type: maestro
    needs: [candidate]
    runs_on: "${{ inputs.platform == 'android' ? 'linux-medium-nested-virtualization' : 'macos-medium' }}"
    environment: preview
    params:
      build_id: ${{ needs.candidate.outputs.build_id }}
      flow_path:
        - .maestro/staging-athlete-auth.yaml
        - .maestro/staging-role-u13-athlete.yaml
        - .maestro/staging-role-parent.yaml
      record_screen: true
      retries: 0
  coaching:
    type: maestro
    needs: [candidate]
    runs_on: "${{ inputs.platform == 'android' ? 'linux-medium-nested-virtualization' : 'macos-medium' }}"
    environment: preview
    params:
      build_id: ${{ needs.candidate.outputs.build_id }}
      flow_path:
        - .maestro/staging-role-college-coach.yaml
        - .maestro/staging-role-club-coach.yaml
        - .maestro/staging-role-hs-coach.yaml
      record_screen: true
      retries: 0
  administration_discovery:
    type: maestro
    needs: [candidate]
    runs_on: "${{ inputs.platform == 'android' ? 'linux-medium-nested-virtualization' : 'macos-medium' }}"
    environment: preview
    params:
      build_id: ${{ needs.candidate.outputs.build_id }}
      flow_path:
        - .maestro/staging-admin-auth.yaml
        - .maestro/staging-role-scout.yaml
        - .maestro/staging-role-agency-owner.yaml
        - .maestro/staging-role-influencer.yaml
      record_screen: true
      retries: 0
