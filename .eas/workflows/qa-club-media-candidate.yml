name: OfferHound installed private media candidate
on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
      platform:
        type: choice
        required: true
        default: ios
        options: [ios, android]
jobs:
  candidate:
    type: repack
    runs_on: "${{ inputs.platform == 'android' ? 'linux-medium' : 'macos-medium' }}"
    environment: preview
    params:
      build_id: ${{ inputs.build_id }}
      profile: staging
      message: Verify Android private media add action and persisted gallery
  club_media:
    type: maestro
    needs: [candidate]
    runs_on: "${{ inputs.platform == 'android' ? 'linux-medium-nested-virtualization' : 'macos-medium' }}"
    environment: preview
    params:
      build_id: ${{ needs.candidate.outputs.build_id }}
      flow_path: .maestro/staging-club-private-media.yaml
      record_screen: true
      retries: 0
