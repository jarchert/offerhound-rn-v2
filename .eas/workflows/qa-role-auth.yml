name: OfferHound isolated all-role native authentication
on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
        description: Finished OfferHound QA simulator or emulator build ID
      platform:
        type: choice
        required: true
        default: ios
        options: [ios, android]
jobs:
  adult_athlete:
    name: QA adult_athlete authentication
    type: maestro
    runs_on: "${{ inputs.platform == 'android' ? 'linux-medium-nested-virtualization' : 'macos-medium' }}"
    environment: preview
    params:
      build_id: ${{ inputs.build_id }}
      flow_path: .maestro/staging-athlete-auth.yaml
      retries: 0
  admin:
    name: QA admin authentication
    type: maestro
    runs_on: "${{ inputs.platform == 'android' ? 'linux-medium-nested-virtualization' : 'macos-medium' }}"
