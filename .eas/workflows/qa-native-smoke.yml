name: OfferHound isolated native QA smoke
on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
        description: Finished OfferHound QA iOS simulator build ID
jobs:
  public_smoke:
    name: QA app launch and sign-in screen
    type: maestro
    environment: preview
    params:
      build_id: ${{ inputs.build_id }}
      flow_path: .maestro/staging-public-smoke.yaml
      retries: 0
      record_screen: false
