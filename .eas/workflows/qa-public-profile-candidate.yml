name: OfferHound public-profile and final share verification
on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
      platform:
        type: choice
        required: true
        default: ios
        options: [ios, android]
jobs:
  candidate:
    type: repack
    runs_on: "${{ inputs.platform == 'android' ? 'linux-medium' : 'macos-medium' }}"
    environment: preview
    params:
      build_id: ${{ inputs.build_id }}
      profile: staging
      message: Verify public profile auth return and actual club share identity
  public_profile:
    type: maestro
    needs: [candidate]
    runs_on: "${{ inputs.platform == 'android' ? 'linux-medium-nested-virtualization' : 'macos-medium' }}"
    environment: preview
    params:
      build_id: ${{ needs.candidate.outputs.build_id }}
      flow_path: .maestro/staging-public-profile-return.yaml
      record_screen: true
      retries: 0
  role_share:
    type: maestro
    needs: [candidate]
    runs_on: "${{ inputs.platform == 'android' ? 'linux-medium-nested-virtualization' : 'macos-medium' }}"
    environment: preview
    params:
      build_id: ${{ needs.candidate.outputs.build_id }}
      flow_path: .maestro/staging-role-share-controls.yaml
      record_screen: true
      retries: 0
  home_settings:
    type: maestro
    needs: [candidate]
    runs_on: "${{ inputs.platform == 'android' ? 'linux-medium-nested-virtualization' : 'macos-medium' }}"
    environment: preview
    params:
      build_id: ${{ needs.candidate.outputs.build_id }}
      flow_path: .maestro/staging-launch-parity.yaml
      record_screen: true
      retries: 0
  club_media:
    type: maestro
    needs: [candidate]
    runs_on: "${{ inputs.platform == 'android' ? 'linux-medium-nested-virtualization' : 'macos-medium' }}"
    environment: preview
    params:
      build_id: ${{ needs.candidate.outputs.build_id }}
      flow_path: .maestro/staging-club-private-media.yaml
      record_screen: true
      retries: 0
