name: OfferHound launch repair regression
on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
      platform:
        type: choice
        required: true
        default: ios
        options: [ios, android]
jobs:
  launch_repairs:
    name: Native login recovery profile Home and account navigation
    type: maestro
    runs_on: "${{ inputs.platform == 'android' ? 'linux-medium-nested-virtualization' : 'macos-medium' }}"
    environment: preview
    params:
      build_id: ${{ inputs.build_id }}
      flow_path:
        - .maestro/staging-launch-parity.yaml
        - .maestro/staging-message-draft.yaml
        - .maestro/staging-camp-flyer.yaml
        - .maestro/staging-theme.yaml
      retries: 0
      record_screen: true
