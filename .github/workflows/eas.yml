name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - 'session-parity-port-phase1-2'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
  EXPO_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

jobs:
  build:
    name: Build (${{ inputs.platform || 'all' }} / ${{ inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Write ASC API Key
        if: ${{ github.event.inputs.platform != 'android' }}
        run: |
          mkdir -p /tmp/expo-asc
          echo "${{ secrets.EXPO_ASC_API_KEY_P8 }}" > /tmp/expo-asc/key.p8

      - name: Build iOS
        if: ${{ github.event.inputs.platform != 'android' }}
        continue-on-error: true
        env:
          EXPO_ASC_API_KEY_PATH: /tmp/expo-asc/key.p8
          EXPO_ASC_API_KEY_ID: ${{ secrets.EXPO_ASC_API_KEY_ID }}
          EXPO_ASC_API_ISSUER_ID: ${{ secrets.EXPO_ASC_API_ISSUER_ID }}
        run: eas build --platform ios --profile ${{ inputs.profile || 'preview' }} --non-interactive

      - name: Build Android
        if: ${{ github.event.inputs.platform != 'ios' }}
        run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive
